services:
  mysql:
    image: mysql:8.4
    container_name: predict-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: predict
      MYSQL_USER: predict
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-predict1234}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root1234}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: predict-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/predict?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: predict
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-predict1234}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      # 운영 환경에서 Caddy(리버스 프록시) 뒤에 있을 때 X-Forwarded-* 헤더를 신뢰하게 함.
      # 이게 없으면 카카오 로그인 redirect가 컨테이너 내부 주소로 잘못 계산됨.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      # 업로드 이미지(이슈 커버, 게시글 첨부) 저장 위치. 컨테이너를 다시 만들어도 남도록 볼륨에 둔다.
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../predict-next-1.0
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    container_name: predict-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # 운영 서버에서만 쓰는 HTTPS 리버스 프록시. 로컬 개발엔 영향 없음(기본 up에는 안 뜸).
  # 도메인 준비되면: docker compose --profile prod up -d --build
  caddy:
    image: caddy:2-alpine
    container_name: predict-caddy
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  uploads-data:
  caddy-data:
  caddy-config:
